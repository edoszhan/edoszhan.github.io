<header class="site-header">
  <div class="wrapper nav-wrapper">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu">
        <span class="sr-only">Menu</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <ul id="nav-menu" class="nav-links">
        <li>
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
        </li>
        <li>
          <a href="{{ '/cv' | relative_url }}"{% if page.url contains '/cv' %} class="active"{% endif %}>CV</a>
        </li>
        <li>
          <a href="{{ '/publications' | relative_url }}"{% if page.url contains '/publications' %} class="active"{% endif %}>Publications</a>
        </li>
        <li>
          <a href="{{ '/projects' | relative_url }}"{% if page.url contains '/projects' %} class="active"{% endif %}>Projects</a>
        </li>
        <li>
          <a href="{{ '/blog' | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} class="active"{% endif %}>Blog</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
